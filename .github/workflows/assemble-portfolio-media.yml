name: Assemble portfolio media

on:
  push:
    branches:
      - agent/update-portfolio-videos
    paths:
      - .upload/READY

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify media files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          expected = {
              'videos/1.mp4': 'e6c1807a0b58668b871a2cb34bfa8f1d4038c7481dd40c8817f580f74d2a393d',
              'videos/14.mp4': '1e08d9093c77cee16b3fb646c17c45cc6ed16539841d12e5ca5e91a426664ab0',
              'videos/15.mp4': '523fee1a719cc2f5750e48ea65684b8e02ba9402b27dfd9d70765f26e6baa44c',
              'videos/16.mp4': '9f39a565b1d7d84ebc9b97e8d3517b0d468df1e377462708dcdf72092eed8cdd',
          }

          upload_dir = Path('.upload')
          if not (upload_dir / 'READY').is_file():
              raise RuntimeError('Missing .upload/READY marker')

          for target_name, expected_sha in expected.items():
              key = target_name.replace('/', '__')
              parts = sorted(upload_dir.glob(f'{key}.part*'))
              if not parts:
                  raise RuntimeError(f'Missing upload chunks for {target_name}')
              encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
              payload = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(payload).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f'SHA-256 mismatch for {target_name}: {actual_sha} != {expected_sha}'
                  )
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f'Wrote {target_name} ({len(payload)} bytes)')

          shutil.rmtree(upload_dir)
          PY

      - name: Commit assembled media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optimized portfolio videos [assembled]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
