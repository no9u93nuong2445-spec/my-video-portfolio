name: Assemble portfolio media

on:
  push:
    branches:
      - agent/add-three-videos-20260815
    paths:
      - .upload/READY

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify media files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          expected = {
              'videos/17.mp4': '21ce62098f1161c6671ba1ca585fd5a2ec73a9026805dfd05715248684471eac',
              'videos/18.mp4': '0645a540e80e612da80793438bfff5e99b22083b0d92220ba9450279ad364d7d',
              'videos/19.mp4': 'e907bf4065d112c0e05f23e874c9776d8cd61ffc14e1883bfc5af99044e3b636',
          }

          upload_dir = Path('.upload')
          if not (upload_dir / 'READY').is_file():
              raise RuntimeError('Missing .upload/READY marker')

          for target_name, expected_sha in expected.items():
              key = target_name.replace('/', '__')
              parts = sorted(upload_dir.glob(f'{key}.part*'))
              if not parts:
                  raise RuntimeError(f'Missing upload chunks for {target_name}')
              encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
              payload = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(payload).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f'SHA-256 mismatch for {target_name}: {actual_sha} != {expected_sha}'
                  )
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f'Wrote {target_name} ({len(payload)} bytes)')

          shutil.rmtree(upload_dir)
          PY

      - name: Generate thumbnails from new videos
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p thumbnails
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos/17.mp4 -frames:v 1 -vf "scale=360:-2" -q:v 5 thumbnails/17_thumb.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos/18.mp4 -frames:v 1 -vf "scale=480:-2" -q:v 5 thumbnails/18_thumb.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos/19.mp4 -frames:v 1 -vf "scale=480:-2" -q:v 5 thumbnails/19_thumb.jpg
          test -s thumbnails/17_thumb.jpg
          test -s thumbnails/18_thumb.jpg
          test -s thumbnails/19_thumb.jpg

      - name: Verify MP4 metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in videos/17.mp4 videos/18.mp4 videos/19.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate -of default=noprint_wrappers=1 "$file"
          done

      - name: Commit assembled media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add three low-bandwidth portfolio videos [assembled]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
