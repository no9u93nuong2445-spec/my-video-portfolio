name: Assemble portfolio media

on:
  push:
    branches:
      - agent/add-three-videos-20260815
    paths:
      - .upload/READY

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[assembled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify media files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil

          expected = {
              'videos-lite/17.mp4': 'd578adbbc9d2a7a2508e8685037e6a1c6d3fb250c9bef51fc99780aaa2f550e2',
              'videos-lite/18.mp4': '56328b6ea3d44a8b5ecfc0a09bfdeef2c984e96ad84e3e4cbfda9f6033bc7cb9',
              'videos-lite/19.mp4': '478867f5a2333ad81175ef6de325cff8585bddb84e3aacbeb70ded80ad795c9c',
          }

          upload_dir = Path('.upload')
          if not (upload_dir / 'READY').is_file():
              raise RuntimeError('Missing .upload/READY marker')

          for target_name, expected_sha in expected.items():
              key = target_name.replace('/', '__')
              parts = sorted(upload_dir.glob(f'{key}.part*'))
              if not parts:
                  raise RuntimeError(f'Missing upload chunks for {target_name}')
              encoded = ''.join(part.read_text(encoding='ascii') for part in parts)
              payload = base64.b64decode(encoded, validate=True)
              actual_sha = hashlib.sha256(payload).hexdigest()
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f'SHA-256 mismatch for {target_name}: {actual_sha} != {expected_sha}'
                  )
              target = Path(target_name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              print(f'Wrote {target_name} ({len(payload)} bytes)')

          shutil.rmtree(upload_dir)
          PY

      - name: Generate thumbnails from new videos
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p thumbnails
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos-lite/17.mp4 -frames:v 1 -vf "scale=360:-2" -q:v 5 thumbnails/17_thumb.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos-lite/18.mp4 -frames:v 1 -vf "scale=480:-2" -q:v 5 thumbnails/18_thumb.jpg
          ffmpeg -hide_banner -loglevel error -y -ss 5 -i videos-lite/19.mp4 -frames:v 1 -vf "scale=480:-2" -q:v 5 thumbnails/19_thumb.jpg
          test -s thumbnails/17_thumb.jpg
          test -s thumbnails/18_thumb.jpg
          test -s thumbnails/19_thumb.jpg

      - name: Verify MP4 metadata
        shell: bash
        run: |
          set -euo pipefail
          for file in videos-lite/17.mp4 videos-lite/18.mp4 videos-lite/19.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate -of default=noprint_wrappers=1 "$file"
          done

      - name: Refresh lightweight manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "count=$(find videos-lite -maxdepth 1 -type f -name '*.mp4' | wc -l)"
            du -ch videos-lite/*.mp4 | tail -n 1
            sha256sum videos-lite/*.mp4
          } > videos-lite/MANIFEST.txt

      - name: Commit assembled media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add three domestic-first portfolio videos [assembled]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
