name: Install portfolio media package

on:
  push:
    branches:
      - agent/update-portfolio-videos
    paths:
      - portfolio-media.zip

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[installed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and verify media package
        shell: bash
        run: |
          set -euo pipefail
          test -f portfolio-media.zip
          rm -rf .portfolio-media-stage
          mkdir .portfolio-media-stage
          unzip -q portfolio-media.zip -d .portfolio-media-stage

          cd .portfolio-media-stage
          sha256sum -c SHA256SUMS.txt

          for file in videos/1.mp4 videos/14.mp4 videos/15.mp4 videos/16.mp4; do
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,pix_fmt,width,height \
              -of default=noprint_wrappers=1 "$file"
          done
          cd ..

          mkdir -p videos thumbnails
          cp .portfolio-media-stage/videos/1.mp4 videos/1.mp4
          cp .portfolio-media-stage/videos/14.mp4 videos/14.mp4
          cp .portfolio-media-stage/videos/15.mp4 videos/15.mp4
          cp .portfolio-media-stage/videos/16.mp4 videos/16.mp4
          cp .portfolio-media-stage/thumbnails/1_thumb.jpg thumbnails/1_thumb.jpg
          cp .portfolio-media-stage/thumbnails/14_thumb.jpg thumbnails/14_thumb.jpg
          cp .portfolio-media-stage/thumbnails/15_thumb.jpg thumbnails/15_thumb.jpg
          cp .portfolio-media-stage/thumbnails/16_thumb.jpg thumbnails/16_thumb.jpg
          rm -rf .portfolio-media-stage portfolio-media.zip

      - name: Commit installed media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/1.mp4 videos/14.mp4 videos/15.mp4 videos/16.mp4
          git add thumbnails/1_thumb.jpg thumbnails/14_thumb.jpg thumbnails/15_thumb.jpg thumbnails/16_thumb.jpg
          git add -A portfolio-media.zip
          git commit -m "Install optimized portfolio videos [installed]"
          git push
