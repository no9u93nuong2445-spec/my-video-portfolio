name: Mainland network smoke test

on:
  push:
    branches:
      - agent/mainland-network-check-v232
    paths:
      - .itdog-check-trigger

permissions:
  contents: read

jobs:
  itdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare headless browser
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version || chromium --version || true
          chromedriver --version || true
          python -m pip install --disable-pip-version-check --quiet selenium

      - name: Run ITDOG mainland HTTP test
        shell: bash
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.keys import Keys

          TARGET = 'https://works.devs.surf/'

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1600')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36')

          driver = webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(60)
          try:
              driver.get('https://www.itdog.cn/http/')
              time.sleep(8)
              print('=== ITDOG PAGE DIAGNOSTIC ===')
              print('title:', driver.title)
              print('url:', driver.current_url)
              body = driver.find_element(By.TAG_NAME, 'body').text
              print('body-preview:')
              for line in [x.strip() for x in body.splitlines() if x.strip()][:80]:
                  print(line)

              candidates = driver.find_elements(By.CSS_SELECTOR, 'input, textarea, [contenteditable="true"]')
              print('candidate-count:', len(candidates))
              for i, el in enumerate(candidates[:40]):
                  try:
                      print('candidate', i, 'tag=', el.tag_name, 'type=', el.get_attribute('type'), 'placeholder=', el.get_attribute('placeholder'), 'name=', el.get_attribute('name'), 'id=', el.get_attribute('id'), 'visible=', el.is_displayed())
                  except Exception:
                      pass

              target_input = None
              for el in candidates:
                  try:
                      ph = (el.get_attribute('placeholder') or '').lower()
                      if ('example.com' in ph or '例：' in ph or 'http' in ph) and el.is_displayed():
                          target_input = el
                          break
                  except Exception:
                      pass

              if target_input is None:
                  # Some versions render the main input inside an iframe.
                  for frame in driver.find_elements(By.TAG_NAME, 'iframe'):
                      try:
                          driver.switch_to.frame(frame)
                          inner = driver.find_elements(By.CSS_SELECTOR, 'input, textarea, [contenteditable="true"]')
                          for el in inner:
                              ph = (el.get_attribute('placeholder') or '').lower()
                              if ('example.com' in ph or 'http' in ph) and el.is_displayed():
                                  target_input = el
                                  break
                          if target_input is not None:
                              break
                          driver.switch_to.default_content()
                      except Exception:
                          driver.switch_to.default_content()

              if target_input is None:
                  raise RuntimeError('ITDOG did not expose a usable target input; likely anti-automation/challenge page')

              target_input.clear()
              target_input.send_keys(TARGET)

              clicked = False
              for el in driver.find_elements(By.XPATH, "//*[contains(normalize-space(text()),'快速测试')]"):
                  if not el.is_displayed():
                      continue
                  try:
                      driver.execute_script('arguments[0].scrollIntoView({block:"center"});', el)
                      driver.execute_script('arguments[0].click();', el)
                      clicked = True
                      break
                  except Exception:
                      pass
              if not clicked:
                  target_input.send_keys(Keys.ENTER)

              deadline = time.time() + 180
              body = ''
              while time.time() < deadline:
                  time.sleep(3)
                  driver.switch_to.default_content()
                  body = driver.find_element(By.TAG_NAME, 'body').text
                  target_seen = 'works.devs.surf' in body
                  completed = ('100%' in body and ('网站测速结果' in body or '区域/运营商' in body))
                  if target_seen and completed:
                      break
              else:
                  raise RuntimeError('ITDOG test did not complete within timeout')

              lines = [line.strip() for line in body.splitlines() if line.strip()]
              print('=== ITDOG MAINLAND TEST TARGET ===')
              print(TARGET)
              print('=== SUMMARY LINES ===')
              keys = ('全部节点', '中国电信', '中国联通', '中国移动', '访问失败', '当前显示', '监测点参与测试')
              emitted = 0
              for line in lines:
                  if any(k in line for k in keys):
                      print(line)
                      emitted += 1
                      if emitted >= 50:
                          break

              print('=== FIRST RESULT ROWS ===')
              start = next((i for i,l in enumerate(lines) if '网站测速结果' in l), None)
              if start is not None:
                  for line in lines[start:start+100]:
                      print(line)

              if 'works.devs.surf' not in body:
                  raise RuntimeError('Result page did not contain requested target')
          finally:
              driver.quit()
          PY
