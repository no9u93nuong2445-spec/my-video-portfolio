name: Mainland network smoke test

on:
  push:
    branches:
      - agent/mainland-network-check-v232
    paths:
      - .itdog-check-trigger

permissions:
  contents: read

jobs:
  tance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare headless browser
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet selenium
      - name: Run mainland website-speed probe
        shell: bash
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          TARGET='works.devs.surf'
          opts=Options(); opts.page_load_strategy='eager'
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--window-size=1440,1800','--lang=zh-CN']:
              opts.add_argument(a)
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36')
          d=webdriver.Chrome(options=opts); d.set_page_load_timeout(40)
          try:
              try: d.get('https://www.tance.cc/')
              except Exception as e:
                  print('page-load warning', type(e).__name__, str(e)[:160]); d.execute_script('window.stop()')
              w=WebDriverWait(d,45)
              time.sleep(5)
              print('title=',d.title); print('url=',d.current_url)

              # Switch to website-speed mode when the tab is available.
              for el in d.find_elements(By.XPATH,"//*[normalize-space(text())='网站测速']"):
                  if el.is_displayed():
                      try: d.execute_script('arguments[0].click()',el); time.sleep(2); break
                      except Exception: pass

              inputs=d.find_elements(By.CSS_SELECTOR,'input')
              target_input=None
              for el in inputs:
                  try:
                      ph=(el.get_attribute('placeholder') or '')
                      if el.is_displayed() and ('域名' in ph or 'IP' in ph):
                          target_input=el; break
                  except Exception: pass
              if not target_input:
                  raise RuntimeError('tance target input not found')
              target_input.clear(); target_input.send_keys(TARGET)

              # Prefer the three mainland consumer networks; if labels are custom, default selection still includes them.
              body_before=d.find_element(By.TAG_NAME,'body').text
              print('=== BEFORE SUBMIT EXCERPT ===')
              for line in [x.strip() for x in body_before.splitlines() if x.strip()][:80]: print(line)

              clicked=False
              for text in ('单次检测','开始检测','检测'):
                  for el in d.find_elements(By.XPATH,f"//*[normalize-space(text())='{text}']"):
                      if el.is_displayed():
                          try: d.execute_script('arguments[0].click()',el); clicked=True; break
                          except Exception: pass
                  if clicked: break
              if not clicked: raise RuntimeError('tance submit button not found')

              deadline=time.time()+210; last=''
              while time.time()<deadline:
                  time.sleep(4)
                  body=d.find_element(By.TAG_NAME,'body').text
                  # Tance streams node results. Finish when the page reports 100% or enough rows exist and progress has stopped.
                  interesting=[x.strip() for x in body.splitlines() if any(k in x for k in ('电信','联通','移动','ms','超时','失败','成功','100%'))]
                  sig='|'.join(interesting[-10:])
                  if sig!=last:
                      print('progress-tail:', interesting[-10:]); last=sig
                  if '100%' in body and all(k in body for k in ('电信','联通','移动')):
                      time.sleep(5); break
              body=d.find_element(By.TAG_NAME,'body').text
              lines=[x.strip() for x in body.splitlines() if x.strip()]
              print('=== TANCE TARGET ==='); print(TARGET)
              print('=== TANCE RESULT EXCERPT ===')
              emitted=0
              for line in lines:
                  if any(k in line for k in ('电信','联通','移动','响应','耗时','首字节','状态','超时','失败','成功','ms','100%')):
                      print(line); emitted+=1
                      if emitted>=240: break
              if not any(k in body for k in ('电信','联通','移动')):
                  raise RuntimeError('tance result did not contain mainland ISP rows')
          finally:
              d.quit()
          PY
