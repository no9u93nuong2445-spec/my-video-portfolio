name: Mainland network smoke test

on:
  push:
    branches:
      - agent/mainland-network-check-v232
    paths:
      - .itdog-check-trigger

permissions:
  contents: read

jobs:
  seventeen-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare headless browser
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version || chromium --version || true
          chromedriver --version || true
          python -m pip install --disable-pip-version-check --quiet selenium

      - name: Diagnose 17CE mainland test page
        shell: bash
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts = Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1800')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36')

          driver = webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(60)
          try:
              driver.get('https://www.17ce.com/site?lang=zh_cn')
              time.sleep(10)
              print('=== 17CE PAGE DIAGNOSTIC ===')
              print('title:', driver.title)
              print('url:', driver.current_url)
              body = driver.find_element(By.TAG_NAME, 'body').text
              print('body-preview:')
              for line in [x.strip() for x in body.splitlines() if x.strip()][:120]:
                  print(line)

              candidates = driver.find_elements(By.CSS_SELECTOR, 'input, textarea, [contenteditable="true"]')
              print('=== FORM CANDIDATES ===')
              print('candidate-count:', len(candidates))
              for i, el in enumerate(candidates[:80]):
                  try:
                      rect = el.rect
                      print('candidate', i,
                            'tag=', el.tag_name,
                            'type=', el.get_attribute('type'),
                            'placeholder=', repr(el.get_attribute('placeholder')),
                            'name=', repr(el.get_attribute('name')),
                            'id=', repr(el.get_attribute('id')),
                            'class=', repr(el.get_attribute('class')),
                            'value=', repr(el.get_attribute('value')),
                            'visible=', el.is_displayed(),
                            'rect=', rect)
                  except Exception as exc:
                      print('candidate-error', i, exc)

              print('=== CLICKABLE TEXT ===')
              clickables = driver.find_elements(By.CSS_SELECTOR, 'button, a, [role="button"], input[type="button"], input[type="submit"]')
              emitted = 0
              for i, el in enumerate(clickables):
                  try:
                      text = (el.text or el.get_attribute('value') or '').strip()
                      if text and el.is_displayed():
                          print('clickable', i, repr(text), 'tag=', el.tag_name, 'id=', repr(el.get_attribute('id')), 'class=', repr(el.get_attribute('class')))
                          emitted += 1
                          if emitted >= 120:
                              break
                  except Exception:
                      pass
          finally:
              driver.quit()
          PY
