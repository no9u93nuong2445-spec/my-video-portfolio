name: Mainland network smoke test

on:
  push:
    branches:
      - agent/mainland-network-check-v232
    paths:
      - .itdog-check-trigger

permissions:
  contents: read

jobs:
  seventeen-ce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare headless browser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet selenium

      - name: Run 17CE China mainland HTTP test
        shell: bash
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          TARGET = 'https://works.devs.surf/'
          opts = Options()
          opts.page_load_strategy = 'eager'
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1800')
          opts.add_argument('--lang=zh-CN')
          opts.add_argument('--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36')

          driver = webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(35)
          try:
              try:
                  driver.get('https://www.17ce.com/site?lang=zh_cn')
              except Exception as exc:
                  print('page-load warning:', type(exc).__name__, str(exc)[:180])
                  try: driver.execute_script('window.stop();')
                  except Exception: pass

              wait = WebDriverWait(driver, 45)
              url_input = wait.until(EC.presence_of_element_located((By.ID, 'url')))
              submit = wait.until(EC.presence_of_element_located((By.ID, 'su')))
              url_input.clear()
              url_input.send_keys(TARGET)

              driver.execute_script("""
                function setCheck(id, value) {
                  const el = document.getElementById(id);
                  if (!el) throw new Error('missing checkbox ' + id);
                  el.checked = value;
                  el.dispatchEvent(new Event('change', {bubbles:true}));
                }
                for (let i=0; i<=10; i++) setCheck('isp'+i, false);
                setCheck('isp1', true); setCheck('isp2', true); setCheck('isp4', true);
                for (let i=0; i<=3; i++) setCheck('area'+i, false);
                setCheck('area1', true);
                for (let i=0; i<=2; i++) setCheck('ntype'+i, false);
                setCheck('ntype0', true);
                const rt1 = document.getElementById('rt1'); if (rt1) rt1.checked = true;
              """)

              selected = driver.execute_script("""return {
                url: document.getElementById('url').value,
                telecom: document.getElementById('isp1').checked,
                unicom: document.getElementById('isp2').checked,
                mobile: document.getElementById('isp4').checked,
                mainland: document.getElementById('area1').checked
              };""")
              print('=== SUBMIT SETTINGS ==='); print(selected)
              driver.execute_script('arguments[0].click();', submit)

              deadline = time.time() + 210
              last_over = None
              while time.time() < deadline:
                  time.sleep(4)
                  over = driver.execute_script("return document.getElementById('ajax_over')?.value || null")
                  node_count = driver.execute_script("return document.getElementById('node_count')?.value || null")
                  if over != last_over:
                      print('progress ajax_over=', over, 'node_count=', node_count)
                      last_over = over
                  body = driver.find_element(By.TAG_NAME, 'body').text
                  if over == '1':
                      time.sleep(6); break
                  if '立即查看结果' in body and any(x in body for x in ('电信','联通','移动')):
                      time.sleep(8); break
              else:
                  print('timeout-state body excerpt:')
                  print('\n'.join(driver.find_element(By.TAG_NAME,'body').text.splitlines()[:120]))
                  raise RuntimeError('17CE mainland test did not finish within 210 seconds')

              body = driver.find_element(By.TAG_NAME, 'body').text
              lines = [line.strip() for line in body.splitlines() if line.strip()]
              print('=== 17CE FINAL URL ==='); print(driver.current_url)
              print('=== TARGET ==='); print(TARGET)
              print('=== RESULT EXCERPT ===')
              for line in lines:
                  if any(k in line for k in ('电信','联通','移动','最快节点','最慢节点','平均响应','平均速度','超时','失败','错误','响应','速度')):
                      print(line)
              print('=== RESULT STATE ===')
              print('ajax_over=', driver.execute_script("return document.getElementById('ajax_over')?.value"))
              print('node_count=', driver.execute_script("return document.getElementById('node_count')?.value"))
              print('resulturl=', driver.execute_script("return document.getElementById('resulturl')?.value"))
          finally:
              driver.quit()
          PY
