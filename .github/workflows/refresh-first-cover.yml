name: Refresh first portfolio cover

on:
  push:
    branches:
      - agent/portfolio-curation-v232
    paths:
      - .refresh-first-cover

permissions:
  contents: write

jobs:
  refresh-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate a clean full-frame cover
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -ss 10.0 -i videos/1.mp4 -frames:v 1 \
            -vf "scale=1280:-2" -q:v 2 thumbnails/1_thumb_v5.jpg
          test -s thumbnails/1_thumb_v5.jpg
          file thumbnails/1_thumb_v5.jpg

      - name: Commit regenerated cover
        shell: bash
        run: |
          set -euo pipefail
          rm -f .refresh-first-cover
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate full-frame cover for 檐下听雨"
          git push origin "HEAD:${GITHUB_REF_NAME}"
